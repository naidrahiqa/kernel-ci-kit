name: example-build

# Example consumer workflow for kernel-ci-kit.
#
# In YOUR kernel repo you would normally do: uses: <owner>/kernel-ci-kit@<tag>
# and check out only your kernel source. Here the kernel source is checked out
# into kernel/ so this repository can demo the action end to end
# (workflow_dispatch) and attach a built zip to the GitHub Release on tag v*.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo (owner/name)'
        required: true
        default: 'naidrahiqa/android_kernel_xiaomi_mt6768-k419'
      kernel_ref:
        description: 'Kernel source branch/tag/SHA'
        required: true
        default: 'PawwwNunungggg24.0'
      defconfig:
        description: 'Kernel defconfig target'
        required: true
        default: 'selene_defconfig'
      device_name:
        description: 'Device codename (zip + AK3 device check)'
        required: true
        default: 'selene'
      toolchain:
        description: 'Toolchain preset (aosp-clang | proton-clang | greenforce-clang)'
        required: true
        default: 'aosp-clang'
      extra_make_args:
        description: 'Extra make args, verbatim'
        required: true
        default: 'LLVM=1 LLVM_IAS=1'
  # Cross-repo trigger: a consumer repo's own workflow can call this one
  # (its `on.push` lives in THAT repo — a workflow never reacts to another
  # repository's events). See kernel/.github/workflows/build.yml.
  workflow_call:
    inputs:
      kit_repo:
        description: 'This toolkit repo (owner/kernel-ci-kit) — defaults to the repo the workflow file came from'
        type: string
        required: false
        default: 'naidrahiqa/kernel-ci-kit'
      kernel_repo:
        description: 'Kernel source repo (owner/name)'
        type: string
        required: false
        default: 'naidrahiqa/android_kernel_xiaomi_mt6768-k419'
      kernel_ref:
        description: 'Kernel source branch/tag/SHA'
        type: string
        required: false
        default: 'PawwwNunungggg24.0'
      defconfig:
        description: 'Kernel defconfig target'
        type: string
        required: false
        default: 'selene_defconfig'
      device_name:
        description: 'Device codename (zip + AK3 device check)'
        type: string
        required: false
        default: 'selene'
      toolchain:
        description: 'Toolchain preset (aosp-clang | proton-clang | greenforce-clang)'
        type: string
        required: false
        default: 'aosp-clang'
      extra_make_args:
        description: 'Extra make args, verbatim'
        type: string
        required: false
        default: 'LLVM=1 LLVM_IAS=1'
  push:
    tags: ['v*']

permissions:
  contents: write

# group includes the repository: caller runs and kit-internal runs must not
# cancel each other. Pushes cancel their own in-flight build (only the newest
# commit is worth the 10 minutes), tags/dispatches queue instead.
concurrency:
  group: example-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Explicit repository + path: when this workflow is CALLED from another
      # repo, github.repository is the caller's, so the default checkout would
      # fetch the kernel source twice and ./kit would not be the toolkit.
      - name: Checkout kernel-ci-kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kit_repo || github.repository }}
          ref: ${{ inputs.kit_repo && 'main' || github.ref }}
          path: kit

      - name: Checkout kernel source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.kernel_repo || 'naidrahiqa/android_kernel_xiaomi_mt6768-k419' }}
          ref: ${{ inputs.kernel_ref || 'PawwwNunungggg24.0' }}
          path: kernel
          fetch-depth: 0

      - name: Notify start
        run: ./kit/scripts/notify-telegram.sh start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_TOPIC_LOG: "8"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_KERNEL_DIR: kernel
          KCK_SOURCE_REPO: ${{ inputs.kernel_repo || 'naidrahiqa/android_kernel_xiaomi_mt6768-k419' }}
          KCK_SOURCE_BRANCH: ${{ inputs.kernel_ref || 'PawwwNunungggg24.0' }}
          KCK_SOURCE_SHA: ${{ github.sha }}

      - name: Build with kernel-ci-kit
        id: kck
        uses: ./kit
        with:
          defconfig: ${{ inputs.defconfig || 'selene_defconfig' }}
          device_name: ${{ inputs.device_name || 'selene' }}
          toolchain: ${{ inputs.toolchain || 'aosp-clang' }}
          extra_make_args: ${{ inputs.extra_make_args || 'LLVM=1 LLVM_IAS=1' }}
          kernel_path: kernel

      - name: Notify success
        if: success()
        run: ./kit/scripts/notify-telegram.sh success "${{ steps.kck.outputs.zip_name }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_TOPIC_LOG: "8"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_KERNEL_DIR: kernel
          KCK_SOURCE_REPO: ${{ inputs.kernel_repo || 'naidrahiqa/android_kernel_xiaomi_mt6768-k419' }}
          KCK_SOURCE_BRANCH: ${{ inputs.kernel_ref || 'PawwwNunungggg24.0' }}
          KCK_SOURCE_SHA: ${{ github.sha }}
          KCK_TOOLCHAIN: ${{ inputs.toolchain || 'aosp-clang' }}
          KCK_BUILD_SECONDS: ${{ steps.kck.outputs.build_seconds }}

      - name: Notify failure
        if: failure()
        run: ./kit/scripts/notify-telegram.sh failed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_TOPIC_LOG: "8"
          TELEGRAM_ERROR_CHANNEL_ID: ${{ secrets.TELEGRAM_ERROR_CHANNEL_ID || '-1003945405514' }}
          KCK_KERNEL_DIR: kernel
          KCK_SOURCE_REPO: ${{ inputs.kernel_repo || 'naidrahiqa/android_kernel_xiaomi_mt6768-k419' }}
          KCK_SOURCE_BRANCH: ${{ inputs.kernel_ref || 'PawwwNunungggg24.0' }}
          KCK_SOURCE_SHA: ${{ github.sha }}
          KCK_TOOLCHAIN: ${{ inputs.toolchain || 'aosp-clang' }}

      - name: Attach zip to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.kck.outputs.zip_path }}
            ${{ steps.kck.outputs.zip_path }}.sha256
          generate_release_notes: true
          body: |
            **Kernel:** ${{ steps.kck.outputs.kernel_version }}
            **Build:** ${{ steps.kck.outputs.build_seconds }}s · ccache ${{ steps.kck.outputs.ccache_hit_rate }}%
            **Source:** ${{ inputs.kernel_repo || 'naidrahiqa/android_kernel_xiaomi_mt6768-k419' }} @ ${{ inputs.kernel_ref || 'PawwwNunungggg24.0' }}
